<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="55%" stop-color="#1c140e"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b">
        <animate attributeName="stop-color" values="#f59e0b;#f97316;#fbbf24;#f59e0b" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#fbbf24">
        <animate attributeName="stop-color" values="#fbbf24;#fde047;#f97316;#fbbf24" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f97316">
        <animate attributeName="stop-color" values="#f97316;#f59e0b;#fde047;#f97316" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#78350f" stroke-width="0.6" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="13" fill="none" stroke="#d97706" stroke-opacity="0.45"/>

  <!-- floating particles -->
  <g fill="#fbbf24">
    <circle cx="120" cy="70" r="2.4" opacity="0.7">
      <animate attributeName="cy" values="70;46;70" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="90" r="2" opacity="0.6">
      <animate attributeName="cy" values="90;120;90" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="240" r="2.6" opacity="0.5">
      <animate attributeName="cy" values="240;214;240" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="250" r="1.8" opacity="0.5">
      <animate attributeName="cy" values="250;272;250" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="52" r="1.8" opacity="0.5">
      <animate attributeName="cx" values="620;660;620" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- code brackets -->
  <text x="64" y="185" font-family="'Fira Code', monospace" font-size="88" fill="#78350f" opacity="0.8">&#123;</text>
  <text x="1084" y="185" font-family="'Fira Code', monospace" font-size="88" fill="#78350f" opacity="0.8">&#125;</text>

  <!-- name -->
  <text x="600" y="140" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="4" fill="url(#nameGrad)" filter="url(#glow)">VAISHNAV GAWARE</text>

  <!-- rotating roles -->
  <g font-family="'Fira Code', monospace" font-size="22" text-anchor="middle" fill="#fbbf24">
    <text x="600" y="190" opacity="0">
      &#62; Full Stack Developer
      <animate attributeName="opacity" values="0;1;1;0;0;0;0" keyTimes="0;0.05;0.28;0.33;0.66;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="190" opacity="0">
      &#62; AI &amp; Data Science Undergrad
      <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.33;0.38;0.43;0.61;0.66;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="190" opacity="0">
      &#62; Generative AI Developer
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.66;0.7;0.71;0.76;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- tagline -->
  <text x="600" y="232" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#d97706" letter-spacing="1.5">ENTERPRISE FULL-STACK &#183; SCALABLE SYSTEMS &#183; INTELLIGENT AI SOLUTIONS</text>

  <!-- animated beam line -->
  <rect x="0" y="268" width="1200" height="2" fill="#78350f"/>
  <rect x="-300" y="267" width="300" height="4" fill="url(#beam)" filter="url(#glow)">
    <animate attributeName="x" values="-300;1200" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- blinking cursor -->
  <rect x="812" y="172" width="11" height="22" fill="#fbbf24">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>

