<svg width="360" height="195" viewBox="0 0 360 195" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c140e"/><stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="358" height="193" rx="12" fill="url(#lbg)" stroke="#d97706" stroke-opacity="0.45"/>
  <text x="22" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#f59e0b">💻 Most Used Languages</text>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#e7e5e4">
    <text x="22" y="62">TypeScript</text>
    <rect x="110" y="52" width="0" height="11" rx="5.5" fill="#f59e0b"><animate attributeName="width" values="0;155" begin="0.20s" dur="1s" fill="freeze"/></rect>
    <text x="338" y="62" fill="#fbbf24" font-weight="700" text-anchor="end">85%</text>

    <text x="22" y="88">JavaScript</text>
    <rect x="110" y="78" width="0" height="11" rx="5.5" fill="#fbbf24"><animate attributeName="width" values="0;24" begin="0.35s" dur="1s" fill="freeze"/></rect>
    <text x="338" y="88" fill="#fbbf24" font-weight="700" text-anchor="end">13%</text>

    <text x="22" y="114">CSS</text>
    <rect x="110" y="104" width="0" height="11" rx="5.5" fill="#f97316"><animate attributeName="width" values="0;8" begin="0.50s" dur="1s" fill="freeze"/></rect>
    <text x="338" y="114" fill="#fbbf24" font-weight="700" text-anchor="end">1.1%</text>

    <text x="22" y="140">Python</text>
    <rect x="110" y="130" width="0" height="11" rx="5.5" fill="#ea580c"><animate attributeName="width" values="0;8" begin="0.65s" dur="1s" fill="freeze"/></rect>
    <text x="338" y="140" fill="#fbbf24" font-weight="700" text-anchor="end">0.2%</text>

    <text x="22" y="166">PLpgSQL</text>
    <rect x="110" y="156" width="0" height="11" rx="5.5" fill="#d97706"><animate attributeName="width" values="0;8" begin="0.80s" dur="1s" fill="freeze"/></rect>
    <text x="338" y="166" fill="#fbbf24" font-weight="700" text-anchor="end">0.1%</text>
  </g>
</svg>
