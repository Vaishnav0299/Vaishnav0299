<svg width="360" height="195" viewBox="0 0 360 195" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c140e"/><stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="358" height="193" rx="12" fill="url(#lbg)" stroke="#d97706" stroke-opacity="0.45"/>
  <text x="22" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#f59e0b">💻 Most Used Languages</text>

  <!-- edit widths (max 210) + % to match your profile -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#d6d3d1">
    <text x="22" y="62">Python</text>
    <rect x="110" y="52" width="0" height="11" rx="5.5" fill="#f59e0b"><animate attributeName="width" values="0;210" begin="0.2s" dur="1s" fill="freeze"/></rect>
    <text x="330" y="62" fill="#fbbf24" text-anchor="end">35%</text>

    <text x="22" y="88">JavaScript</text>
    <rect x="110" y="78" width="0" height="11" rx="5.5" fill="#fbbf24"><animate attributeName="width" values="0;156" begin="0.35s" dur="1s" fill="freeze"/></rect>
    <text x="330" y="88" fill="#fbbf24" text-anchor="end">26%</text>

    <text x="22" y="114">TypeScript</text>
    <rect x="110" y="104" width="0" height="11" rx="5.5" fill="#f97316"><animate attributeName="width" values="0;114" begin="0.5s" dur="1s" fill="freeze"/></rect>
    <text x="330" y="114" fill="#fbbf24" text-anchor="end">19%</text>

    <text x="22" y="140">SQL</text>
    <rect x="110" y="130" width="0" height="11" rx="5.5" fill="#ea580c"><animate attributeName="width" values="0;72" begin="0.65s" dur="1s" fill="freeze"/></rect>
    <text x="330" y="140" fill="#fbbf24" text-anchor="end">12%</text>

    <text x="22" y="166">HTML / CSS</text>
    <rect x="110" y="156" width="0" height="11" rx="5.5" fill="#d97706"><animate attributeName="width" values="0;48" begin="0.8s" dur="1s" fill="freeze"/></rect>
    <text x="330" y="166" fill="#fbbf24" text-anchor="end">8%</text>
  </g>
</svg>
