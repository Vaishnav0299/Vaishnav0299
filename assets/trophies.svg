<svg width="980" height="130" viewBox="0 0 980 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tcard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c140e"/><stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 7 trophies: edit titles/ranks freely -->
  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <!-- trophy template repeated -->
    <g transform="translate(10,5)">
      <rect width="128" height="120" rx="12" fill="url(#tcard)" stroke="#d97706" stroke-opacity="0.45"/>
      <text x="64" y="46" font-size="30">🏆</text>
      <text x="64" y="76" font-size="12.5" fill="#d6d3d1">Commits</text>
      <text x="64" y="100" font-size="16" font-weight="800" fill="#fbbf24">A+</text>
    </g>
    <g transform="translate(148,5)">
      <rect width="128" height="120" rx="12" fill="url(#tcard)" stroke="#d97706" stroke-opacity="0.45"/>
      <text x="64" y="46" font-size="30">⭐</text>
      <text x="64" y="76" font-size="12.5" fill="#d6d3d1">Stars</text>
      <text x="64" y="100" font-size="16" font-weight="800" fill="#f59e0b">A</text>
    </g>
    <g transform="translate(286,5)">
      <rect width="128" height="120" rx="12" fill="url(#tcard)" stroke="#d97706" stroke-opacity="0.45"/>
      <text x="64" y="46" font-size="30">🔀</text>
      <text x="64" y="76" font-size="12.5" fill="#d6d3d1">Pull Requests</text>
      <text x="64" y="100" font-size="16" font-weight="800" fill="#f59e0b">A</text>
    </g>
    <g transform="translate(424,5)">
      <rect width="128" height="120" rx="12" fill="url(#tcard)" stroke="#d97706" stroke-opacity="0.45"/>
      <text x="64" y="46" font-size="30">📦</text>
      <text x="64" y="76" font-size="12.5" fill="#d6d3d1">Repositories</text>
      <text x="64" y="100" font-size="16" font-weight="800" fill="#fbbf24">A+</text>
    </g>
    <g transform="translate(562,5)">
      <rect width="128" height="120" rx="12" fill="url(#tcard)" stroke="#d97706" stroke-opacity="0.45"/>
      <text x="64" y="46" font-size="30">🐛</text>
      <text x="64" y="76" font-size="12.5" fill="#d6d3d1">Issues</text>
      <text x="64" y="100" font-size="16" font-weight="800" fill="#f97316">B+</text>
    </g>
    <g transform="translate(700,5)">
      <rect width="128" height="120" rx="12" fill="url(#tcard)" stroke="#d97706" stroke-opacity="0.45"/>
      <text x="64" y="46" font-size="30">👥</text>
      <text x="64" y="76" font-size="12.5" fill="#d6d3d1">Followers</text>
      <text x="64" y="100" font-size="16" font-weight="800" fill="#f59e0b">A</text>
    </g>
    <g transform="translate(838,5)">
      <rect width="128" height="120" rx="12" fill="url(#tcard)" stroke="#d97706" stroke-opacity="0.45"/>
      <text x="64" y="46" font-size="30">🚀</text>
      <text x="64" y="76" font-size="12.5" fill="#d6d3d1">Experience</text>
      <text x="64" y="100" font-size="16" font-weight="800" fill="#fbbf24">S</text>
    </g>
  </g>

  <!-- moving shine sweep across all trophies -->
  <rect x="-200" y="0" width="140" height="130" fill="url(#shine)" transform="skewX(-18)">
    <animate attributeName="x" values="-200;1080" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
