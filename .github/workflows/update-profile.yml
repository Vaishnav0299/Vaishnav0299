name: Daily Dynamic Profile Sync

on:
  schedule:
    - cron: '0 0 * * *' # Runs everyday at midnight UTC (05:30 AM IST)
  workflow_dispatch: # Allows manual one-click trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Dynamic Profile Updater
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/update_stats.py

      - name: Commit and push updated assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ stats.svg langs.svg activity.svg
          if git diff --staged --quiet; then
            echo "No changes in profile statistics."
          else
            git commit -m "chore(auto): daily update dynamic profile stats and activity [skip ci]"
            git push
          fi
